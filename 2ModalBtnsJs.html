<!-- VALIDADOR DOCUMENTO NACIONAL ESPAÑOL -->
<script>
function tipoDocumentoEspanol(numero) {
    // Verificar si 'numero' es una cadena de texto no vacía
    if (typeof numero !== 'string' || numero.trim() === '') {
        // Si no es una cadena de texto o está vacía, devolver el mensaje de error.
        return "No es un CIF, DNI ni NIE válido";
    }

    // Eliminar posibles espacios en blanco al principio y al final
    numero = numero.trim();

    // Patrones regulares para CIF, DNI y NIE
    var patronNif = /^(\d{8})([A-Z])$/;
    var patronCif = /^([ABCDEFGHJKLMNPQRSUVW])(\d{7})([0-9A-J])$/;
    var patronNie = /^[XYZ]\d{7}[TRWAGMYFPDXBNJZSQVHLCKE]$/i;

    // Comprobar si el número coincide con alguno de los patrones
    if (patronNie.test(numero)) {
        var nieLetra = numero.charAt(8).toUpperCase();

        // Asignar valores a las letras iniciales
        var valorX = 0;
        var valorY = 1;
        var valorZ = 2;

        // Obtener la primera letra y asignar el valor correspondiente
        var primeraLetra = numero.charAt(0).toUpperCase();
        var valorPrimeraLetra = (primeraLetra === 'X') ? valorX : (primeraLetra === 'Y') ? valorY : (primeraLetra === 'Z') ? valorZ : 0;

        // Obtener los dígitos restantes
        var nieNumero = valorPrimeraLetra + numero.substr(1, 7);

        // Calcular la letra de control para el NIE
        var letrasNIE = 'TRWAGMYFPDXBNJZSQVHLCKE';
        var restoNIE = nieNumero % 23;
        var letraControlCalculadaNIE = letrasNIE.charAt(restoNIE);

        // Verificar si la letra de control coincide
        if (letraControlCalculadaNIE === nieLetra) {
            return "NIE";
        } else {
            return "NIE inválido";
        }
    } else if (patronNif.test(numero)) {
        var dniNumero = numero.substring(0, 8);
        var dniLetra = numero.charAt(8).toUpperCase();

        // Calcular la letra de control para el DNI
        var letrasDNI = 'TRWAGMYFPDXBNJZSQVHLCKE';
        var restoDNI = dniNumero % 23;
        var letraControlCalculadaDNI = letrasDNI.charAt(restoDNI);

        // Verificar si la letra de control coincide
        if (letraControlCalculadaDNI === dniLetra) {
            return "DNI";
        } else {
            return "DNI inválido";
        }
    } else if (patronCif.test(numero)) {
        return validarCIF(numero);
    } else {
        return "No es un CIF, DNI ni NIE válido";
    }
}

/** Funcion que revisa la validación del CIF, si da error, hacer una implementación de prueba, y cambiar
 * return "CIF Inválido";
 * 
 * */
function validarCIF(cif) {
    var letra = cif.charAt(0).toUpperCase();
    var numero = cif.substr(1, 7);
    var digitoControl = cif.charAt(8).toUpperCase();

    var sumaPares = 0;
    var sumaImpares = 0;

    for (var i = 0; i < numero.length; i++) {
        if (i % 2 === 0) { // posiciones impares (0, 2, 4, 6)
            var doble = (parseInt(numero.charAt(i)) * 2).toString();
            var suma = 0;
            for (var j = 0; j < doble.length; j++) {
                suma += parseInt(doble.charAt(j));
            }
            sumaImpares += suma;
        } else { // posiciones pares (1, 3, 5)
            sumaPares += parseInt(numero.charAt(i));
        }
    }

    var total = sumaPares + sumaImpares;
    var resto = total % 10;
    var digitoCalculado = (resto === 0) ? 0 : (10 - resto);

    var letrasControl = 'JABCDEFGHI';
    var letraCalculada = letrasControl.charAt(digitoCalculado);

    if (/[ABCDEFGHJNPQRSUVW]/.test(letra)) { // Letras que llevan dígito de control numérico
        if (digitoControl == digitoCalculado) {
            return "CIF";
        } else {
          //Cambiar a CIF Inválido
            return "CIF Inválido";
        }
    } else if (/[KLM]/.test(letra)) { // Letras que llevan dígito de control letra
        if (digitoControl == letraCalculada) {
            return "CIF";
        } else {
          //Cambiar a CIF Inválido
            return "CIF Inválido";
        }
    } else {
          //Cambiar a CIF Inválido
        return "CIF Inválido";
    }
}
</script>

function validarFormularioFirmadosNoVacio() {
    document.getElementById("selectProveedor").disabled = false;
    document.getElementById("selectProvedor").disabled = false;
    // Selecciona todos los elementos padres con la clase validarCamposFran
    var padres = document.querySelectorAll('.validarCamposFran');

    // Variable para almacenar los nombres de los campos vacíos
    var camposVacios = [];

    // Recorre todos los elementos padres seleccionados
    padres.forEach(function(padre) {
        // Busca el input dentro del padre
        var input = padre.querySelector('input, select, textarea');

        // Verifica si el valor del input está vacío
        if (input.value.trim() === '') {
            // Obtiene el texto del label asociado al input
            var label = padre.querySelector('label').innerText;
            // Almacena el nombre del campo vacío
            camposVacios.push(label);
        }
    });

    // Si hay campos vacíos, muestra una alerta con los nombres de los campos
    if (camposVacios.length > 0) {
        var mensaje = 'Por favor, complete los siguientes campos:\n\n';
        camposVacios.forEach(function(nombreCampo) {
            mensaje += '- ' + nombreCampo + '\n';
        });
        Swal.fire({
        icon: "error",
        title: mensaje
        });
        document.getElementById("selectProveedor").disabled = true;
        document.getElementById("selectProvedor").disabled = true;
        return false;
    }

    // Retorna true si no hay ningún campo vacío
    return true;
}

<!--Resumen-->
<script>
  //Resumen
  function addFacturaResumen(idArchivo) {
    var archivosDiv = document.getElementById('contedorResumenFactura');
    archivosDiv.innerHTML = ''; // Limpiar el contenido anterior
    addTitulo('h5','contedorResumenFactura','Resumen factura')
    var divFacturaResumen = document.createElement('div');
    divFacturaResumen.className='flexRCC'
    var tituloFacturaResumen = document.createElement('p');
    tituloFacturaResumen.innerHTML='Factura :'
    var enlaceDescarga = document.createElement('a');
    enlaceDescarga.href = idArchivo;
    enlaceDescarga.target = '_blank';
    var iconoDescarga = document.createElement('i');
    iconoDescarga.className = 'material-icons left btnPdf';
    iconoDescarga.textContent = 'picture_as_pdf';
    // Construir la estructura del enlace de descarga
    enlaceDescarga.appendChild(iconoDescarga);
    divFacturaResumen.appendChild(tituloFacturaResumen);
    divFacturaResumen.appendChild(enlaceDescarga);
    // Agregar los elementos creados al contenedor
    archivosDiv.appendChild(divFacturaResumen);
  }

  //Resumen
  function addAlbaranesResumen(archivos) {
    var archivosDiv = document.getElementById('contedorResumenAlbaranes');
    // Limpiar el contenido anterior
    archivosDiv.innerHTML = '';
    archivos.forEach(function(archivo) {
      var idArchivo = Object.keys(archivo)[0];
      var detallesArchivo = archivo[idArchivo];

      // Crear elementos HTML de manera dinámica
      var divArchivo = document.createElement('div');
      divArchivo.className = 'flexRCC';

      var divArchivo1 = document.createElement('div');
      var divArchivo2 = document.createElement('div');


      var parrafoAlbaran = document.createElement('p');
      parrafoAlbaran.textContent = 'NºAlbarán: ' + idArchivo;

      var parrafoFecha = document.createElement('p');
      parrafoFecha.textContent = 'Fecha de Albarán: ' + detallesArchivo.fechaAlbaran;

      var parrafoURL = document.createElement('p');
      var enlaceDescarga = document.createElement('a');
      enlaceDescarga.href = detallesArchivo.urlArchivoAlbaran;
      enlaceDescarga.target = '_blank';
      var iconoDescarga = document.createElement('i');
      iconoDescarga.className = 'material-icons left btnPdf';
      iconoDescarga.textContent = 'picture_as_pdf';
      
      // Construir la estructura del enlace de descarga
      enlaceDescarga.appendChild(iconoDescarga);
      parrafoURL.appendChild(enlaceDescarga);

      // Agregar los elementos al div del archivo

      divArchivo1.appendChild(parrafoAlbaran);
      divArchivo1.appendChild(parrafoFecha);
      divArchivo2.appendChild(parrafoURL);
      divArchivo.appendChild(divArchivo1);
      divArchivo.appendChild(divArchivo2);


      // Agregar el div del archivo al contenedor
      archivosDiv.appendChild(divArchivo);
    });

    // Mostrar la cantidad de archivos seleccionados
    var parrafoTotalArchivos = document.createElement('p');
    parrafoTotalArchivos.textContent = 'Albaranes seleccionados: ' + archivos.length;
    archivosDiv.appendChild(parrafoTotalArchivos);
  }
</script>
