function comprobarFotosAlbaranes(dato1, dato2, dato3) {
  console.group("🧾 comprobarFotosAlbaranes");
  //console.log("Args:", dato1, dato2, dato3);

  console.log("archivosFacturasEnEspera =", archivosFacturasEnEspera);

  if (archivosFacturasEnEspera !== 0) {
    console.warn("⏳ Hay archivos en espera, no se procesa nada");
    console.groupEnd();
    return;
  }

  console.log("✅ No hay archivos en espera, continuamos");

  mostrarOcultarLoaderGeneral(
    'cargaEnvioGeneral',
    'textoCargaGeneral',
    "Añadiendo albaranes",
    'ocultarImportant',
    'carga'
  );

  var containerElement = document.getElementById('contenedorSecundario');
  if (!containerElement) {
    console.error("❌ No existe contenedorSecundario");
    console.groupEnd();
    return;
  }

  var chil = containerElement.children;
  var numerosIdElementos = [];

  console.group("🔢 Extracción de IDs");
  for (var i = 0; i < chil.length; i++) {
    var id = chil[i].id;
    var match = id.match(/\d+$/);

    if (!match) {
      console.warn("⚠️ ID sin número:", id);
      continue;
    }

    numerosIdElementos.push(parseInt(match[0]));
    console.log("✔", id, "→", match[0]);
  }
  console.groupEnd();

  var datalist = document.getElementById('datalistAlbaranesSinFactura');
  var options = datalist ? datalist.querySelectorAll('option') : [];

  console.log("📄 options datalist:", options.length);

  var arrayFacturas = [];

  console.group("🧪 Evaluación de albaranes");
  numerosIdElementos.forEach(function(id) {
    console.group("🔹 ID:", id);

    var contendorImg = document.getElementById('listaImg' + id);
    var nAlbaranInput = document.getElementById('nAlbaran' + id);
    var fechaInput = document.getElementById('fechaAlbaran' + id);
    var archivoInput = document.getElementById('idArchivoAlbaran' + id);

    var nAlbaranValue = nAlbaranInput ? nAlbaranInput.value : "";
    var fechaAlbaranValue = fechaInput ? fechaInput.value : "";
    var urlArchivoAlbaran = archivoInput ? archivoInput.value : "";

    console.log("nAlbaran:", nAlbaranValue);
    console.log("fecha:", fechaAlbaranValue);
    console.log("img:", !!contendorImg);
    console.log("archivo:", urlArchivoAlbaran);

    var duplicado = false;
    options.forEach(function(option) {
      if (option.value === nAlbaranValue && nAlbaranValue !== "") {
        duplicado = true;
      }
    });

    console.log("duplicado:", duplicado);

    if ((contendorImg && fechaAlbaranValue !== "") || duplicado) {
      console.log("✅ Se añade al arrayFacturas");

      arrayFacturas.push({
        [nAlbaranValue]: {
          fechaAlbaran: fechaAlbaranValue,
          urlArchivoAlbaran: urlArchivoAlbaran
        }
      });
    } else {
      console.log("⛔ No cumple condiciones");
    }

    console.groupEnd();
  });
  console.groupEnd();

  console.log("📦 arrayFacturas generado:", arrayFacturas);

  var inputObjetoFacturas = document.getElementById('objetoConjuntoFacturas');
  if (!inputObjetoFacturas) {
    console.error("❌ No existe objetoConjuntoFacturas");
    console.groupEnd();
    return;
  }

  if (inputObjetoFacturas.value !== '') {
    console.log("🔁 Concatenando facturas anteriores");
    var anteriores = JSON.parse(inputObjetoFacturas.value);
    inputObjetoFacturas.value = JSON.stringify([...arrayFacturas, ...anteriores]);
  } else {
    console.log("🆕 Guardando solo facturas nuevas");
    inputObjetoFacturas.value = JSON.stringify(arrayFacturas);
  }

  console.log("📨 Valor final inputObjetoConjuntoFacturas:", inputObjetoFacturas.value);

  var formulario = document.getElementById('formularioFirmarFactura');
  if (!formulario) {
    console.error("❌ No existe formularioFirmarFactura");
    console.groupEnd();
    return;
  }

  console.log("🚀 Llamada a guardarAlbaranes");

  google.script.run
    .withSuccessHandler(function(data) {
      console.group("✅ Success guardarAlbaranes");
      console.log("Respuesta servidor:", data);

      contadorInputsAlbaranes = 0;
      contadorInputsFactura = 0;

      addComponenteImgBlur();

      obtenerDatos(datosAlbaranes)
        .then(function(albaranesRes) {
          console.log("📥 Datos albaranes refrescados");
          albaranes = albaranesRes;

          mostrarOcultarLoaderGeneral(
            'cargaEnvioGeneral',
            'textoCargaGeneral',
            "Añadiendo archivos.",
            'carga',
            'ocultarImportant'
          );

          cerrarModal("modalGeneral");
          abrirModalAdjuntarFactura(datos_exp_abrirModalAdjuntarFactura);
        })
        .catch(function(err) {
          console.error("❌ Error obtenerDatos:", err);
        });

      console.groupEnd();
    })
    .guardarAlbaranes(formulario);

  console.groupEnd();
}


</script>

<script>

    }

    var divElement = document.createElement('div');
    divElement.classList.add('flexRowSpaceEvenlyWrap', 'col', 's6', 'row');

    childDivElement.classList.add('flexRowSpaceEvenlyWrap', 'col', 's12', 'm12', 'l12', 'row');

    // Creamos el titulo del campo

    inputIdArchivo.setAttribute('type', 'text');

    inputIdArchivo.setAttribute('name', idInputIdArchivos);
    inputIdArchivo.setAttribute('class', 'ocultar');

    // Crear el elemento de entrada de archivo
    var inputFileElement = document.createElement('input');
    inputFileElement.setAttribute('type', 'file');

    inputFileElement.setAttribute('capture', 'camera');

    previewDiv.classList.add('preview');
    previewDiv.setAttribute('id', idContenedorPreview);
    previewDiv.setAttribute('for', inputIdName);

    // Crear el elemento de drop zone

    contendorHtml.appendChild(divElement);

    inputFileElement.addEventListener("change", () => actualizarDivImagen(previewDiv, inputFileElement, obj, idContenedorDropZone, idListaImg, "elimnarElemento", clase, idContenedorPreview, inputIdName,idInputIdArchivos,idsArchivos,idInputIdArchivos), { passive: true });

<!---------------------------Crear imagen y boton elemento html--------------------------------------------->
<script>
  function crearImgYBtn(listaImgs,archivosSelecionados,nombreFuncion,obj,clase,lista,box,dropZone,archivos,inputId){
    for (const archivo of archivosSelecionados) {
      const divImg = document.createElement('div');
      const btnEliminarElemento = document.createElement('button');
      const iconoBtn = document.createElement('i');
      const infoImg = document.createElement('p');

      iconoBtn.setAttribute("class","material-icons material-iconss")

      iconoBtn.innerHTML='close'
      divImg.setAttribute("class",clase)
      
      divImg.setAttribute("type","button")

      divImg.setAttribute("id",archivo.name)

      btnEliminarElemento.setAttribute("onClick", nombreFuncion+"('"+archivo.name+"', '"+lista+"', '"+box+"', '"+archivos+"', '"+obj+"', '"
      +dropZone+"', '"+inputId+"')");
      btnEliminarElemento.setAttribute("type","button")
      btnEliminarElemento.setAttribute("class","boton-eliminar")
      //si el archivo es valido continua
      if (validarTipoArchivo(archivo)) {
        const imagen = document.createElement('img');
        imagen.setAttribute("class",obj)
        imagen.file=archivo
        imagen.src = URL.createObjectURL(archivo);
        divImg.appendChild(imagen);
        btnEliminarElemento.appendChild(iconoBtn)
        divImg.appendChild(btnEliminarElemento)
        if(imagen.file.type=="application/pdf"){
          //Si el tipo de archivo no es válido, mostramos un mensaje dentro de un elemento de la lista 
          const reader = new FileReader();
          reader.onload = (function(aImg){return function(e){aImg.src="https://drive.google.com/thumbnail?id=1KjhN_5JSvdxhXDmu0wezoyVRV6315WSE";}
          ;})(imagen);
          reader.readAsDataURL(imagen.file)
        }else{
          const reader = new FileReader();
          reader.onload = (function(aImg){return function(e){aImg.src=e.target.result;};})(imagen);
        }
      } else {
        infoImg.textContent = `File name ${archivo.name}: Not a valid file type. Update your selection.`;
        divImg.appendChild(infoImg);
      }
      listaImgs.appendChild(divImg);
    }  
  }
</script>

<script>
  function subirArchivo(selector,contenedor,idInputIdArchivos,tipoFuncion,form,tipoRetorno,idCarpeta){

      for(i=0;i<archivosHtm.length;i++){
        const nombre = archivosHtm[i].file.name

        new FileUploadGeneral(archivosHtm[i].file,elemthtml,contenedor,idInputIdArchivos,tipoFuncion,form,tipoRetorno,idCarpeta)
      }
    }else{
      // mostrarOcultarLoader('cargaAddEmpresa','textoCargaAddEmpresa',"",'ocultarImportant','mostrar')

  function FileUploadGeneral(file,html,contenedor,idInputIdArchivos,tipoFuncion,form,tipoRetorno,idCarpeta) {
   var carpetaDestino= document.getElementById('idCarpeta').value
   if (carpetaDestino.trim() === '') {
    // Asignar un valor por defecto si está vacía
    carpetaDestino = idCarpeta ? idCarpeta : '1boj00o0a5CUdZM_v56Wv6C6n6uCISG7k';
    }
    var reader = new FileReader();
    reader.onload = function(event) {
      const obj = {
        filename: file.name,
        mineType: false.type,
        bytes: [...new Int8Array(event.target.result)]
      }
      var imgCarpeta = [obj,carpetaDestino,tipoRetorno]
      google.script.run
      .withSuccessHandler(function(data) {
        enviarIdGeneral(data, contenedor,idInputIdArchivos,tipoFuncion,form); // Pasa los parámetros adicionales a la función
      })
      .subirArchivos(imgCarpeta)
    }
    reader.readAsArrayBuffer(file)
  }
</script>
