

<!-- Funciones de las promesas -->
<script>
  // --- Función genérica para reducir repetición ---
  function ejecutarServidor(funcion, ...args) {
    nProcesos++;
    comprobarNprocesos('textoNotificacion', 'Nº Solicitudes de datos: ' + nProcesos);

    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((value) => {
          nProcesos--;
          comprobarNprocesos('textoNotificacion', 'Nº Solicitudes de datos: ' + nProcesos);
          console.log(`Éxito en ${funcion}`);
          resolve(value);
        })
        .withFailureHandler((err) => {
          nProcesos--;
          comprobarNprocesos('textoNotificacion', 'Nº Solicitudes de datos: ' + nProcesos);
          console.error(`Error en ${funcion}`, err);
          reject(err);
        })
        [funcion](...args);
    });
  }

  // --- Adaptaciones de tus funciones existentes ---
  function obtenerUsuarios() {
    return ejecutarServidor('usuariosDatosLimitados');
  }

  function obtenerDatos(variable) {
    if (variable.length == 2){
      return ejecutarServidor('obtenerDatosTabla', variable, true);
    }else if (variable.length == 3){
      return ejecutarServidor('obtenerDatosTablaBQ', variable, true);
    }
      
  }

  function obtenerExpedientesDisponibles(variable) {
    return ejecutarServidor('obtenerExpedientesDisponibles_gs', variable)
      .then((value) => JSON.parse(value));
  }

  function obtenerCuentaContable6Promesa() {
    return ejecutarServidor('obtenerCuentaContable').then((value) => {
      // Transformar array de objetos en array de strings para mantener compatibilidad
      const cuentas = value.map(c => `${c.AnaCodigoCuenta} - ${c.Cuenta}`); // o `${c.AnaCodigoCuenta} - ${c.Cuenta}` si quieres mostrar código también
      cuentaCorrienteGlobal = cuentas;
      return cuentas;
    });
  }

  // --- Funciones auxiliares optimizadas ---
  function inicializarUsuarios(usuariosRes) {
    const datalist2 = document.getElementById("datalistoptions2");
    usuarios = usuariosRes;

    if (datalist2) {
      const fragment = document.createDocumentFragment();
      const len = usuariosRes.length;
      for (let i = 0; i < len; i++) {
        const nombre = obtenerNombreUsuario(usuariosRes[i][2]);
        const option = document.createElement("option");
        option.value = nombre;
        fragment.appendChild(option);
      }

      datalist2.appendChild(fragment);
      mostrarOcultarElemento('idLoadUsuarios', 'idLabelUsuarios', 'selectUsuario');
    }
  }

  function inicializarExpedientes(expedientesDisponibles) {
    const datalist1 = document.getElementById("datalistoptions1");

    const data = expedientesDisponibles[0];
    infoCM = data.cm;
    infoLI = data.li;
    infoNG = data.ng;
    infoCMA = data.cm_ant;

    datosCombinados = Object.assign({}, infoCM, infoLI, infoNG);
    const identificadores = Object.keys(datosCombinados);
    identificadores.push('Sin contrato');

    objetoControlGS = expedientesDisponibles;
    arrayExpedientesDisponibles = identificadores;

    if (datalist1) {
      const fragment = document.createDocumentFragment();
      for (let i = 0, len = identificadores.length; i < len; i++) {
        const option = document.createElement("option");
        option.value = identificadores[i];
        fragment.appendChild(option);
      }
      datalist1.appendChild(fragment);
      mostrarOcultarElemento('idLoadNexpediente', 'idLabelNexpediente', 'selectNexpediente');
    }
  }

  // --- Inicialización diferida de DataTables ---
  function inicializarTablasDiferido(facturasPrimera) {
    // Esperamos un poco para asegurar que el DOM esté completamente listo
    setTimeout(() => {
      if ($('#tablaControlSolicitudFirma').length && $('#tablaContabilizar').length) {
        actualizarTablasFacturas(facturasPrimera);
        console.log('✅ Tablas inicializadas de forma diferida');
      } else {
        console.warn('⏳ Aún no existen las tablas, reintentando...');
        setTimeout(() => inicializarTablasDiferido(facturasPrimera), 300);
      }
    }, 200);
  }

  function inicializarFacturasYAlbaranes(facturasRes, albaranesRes) {
    const facturasPrimera = facturasRes;
    const len = facturasRes.length;
    const facturas = [];
    for (let i = 1; i < len; i++) {
      const enlace = facturasRes[i][12];
      if (enlace && !enlace.includes("Aun sin firmar")) facturas.push(enlace);
    }

    arrayFacturas = facturas;
    albaranes = albaranesRes;

    const $tablaFirma = $('#tablaControlSolicitudFirma');
    const $tablaConta = $('#tablaContabilizar');

    $tablaFirma.off('click').on('click', '#btnRevisarFactura', function() {
      const datos = $tablaFirma.DataTable().row($(this).closest('tr')).data();
      if (datosCombinados && Object.keys(datosCombinados).length > 0) abrirModalAdjuntarFactura(datos);
      else generarAviso('¡Faltan datos por cargar!', 'error', false, false, 'Información de los expedientes disponibles');
    });

    $tablaConta.off('click').on('click', '#btnContabilizar', function() {
      const datos = $tablaConta.DataTable().row($(this).closest('tr')).data();
      if (datos[10] === "Firmado" && cuentaCorrienteGlobal && cuentaCorrienteGlobal.length > 0) {
        abrirModalContabilizar(datos);
      } else if (datos[10] !== "Firmado") {
        if(typeof cuentaCorrienteGlobal != "undefined"){
          abrirModalContabilizar(datos)
        }else{
          generarAviso('¡Falta Cuenta Corriente 6 por cargar!','error',false,false,'Estado de la factura')
        }
      } else {
        generarAviso('¡Falta Cuenta Corriente 6 por cargar!', 'error', false, false, 'Información de los expedientes disponibles');
      }

    });
    /*
    $tablaConta.on('click', '#btnInfoProveedorF', function() {
      const datos = $tablaConta.DataTable().row($(this).closest('tr')).data();
      abrirModalInfoProveedor(datos);
    });*/

    $tablaFirma.on('click', '#btnInfoProveedorS', function() {
      const datos = $tablaFirma.DataTable().row($(this).closest('tr')).data();
      abrirModalInfoProveedor(datos);
    });

    // Cargar las DataTables de forma diferida (más fluido y no bloqueante)
    inicializarTablasDiferido(facturasPrimera);
  }
</script>
