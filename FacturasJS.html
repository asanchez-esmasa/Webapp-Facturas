// Función para convertir el texto del TD a un número correcto
function convertirATextoANumero(texto) {
    // Eliminar los puntos de miles y reemplazar las comas por puntos
    var textoModificado = texto.replace(/\./g, '').replace(/,/g, '.');
    return parseFloat(textoModificado);
}
// Función para formatear el número
function formatearNumeroEuros(numero) {
    var partes = numero.toFixed(3).split('.'); // Dividir en parte entera y decimal
    var parteEntera = partes[0];
    var parteDecimal = partes[1];

    // Formatear parte entera con puntos para los miles
    var parteEnteraFormateada = '';
    while (parteEntera.length > 3) {
        parteEnteraFormateada = '.' + parteEntera.slice(-3) + parteEnteraFormateada;
        parteEntera = parteEntera.slice(0, -3);
    }
    parteEnteraFormateada = parteEntera + parteEnteraFormateada;
    // Limitar la parte decimal a 2 dígitos
    parteDecimal = parteDecimal.slice(0, 2);

    // Juntar parte entera y decimal con coma
    return parteEnteraFormateada + ',' + parteDecimal+ ' €';
}
