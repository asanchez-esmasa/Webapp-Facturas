  /** Transforma un String JSON a un objeto JSON/Array y devuelve la longitud del array , lo uso en generar columnas para recuperar el nº de albaranes */
  function obtenerLongitudArrayParaNumAlbaranes(jsonString) {

      try {
 
          if (jsonString === "Sin albaranes" || jsonString === "[]") {
              return 0;
          }
          
          const array = JSON.parse(jsonString);
          
          if (Array.isArray(array)) {
              return array.length;
          } else {
              return 0;
          }
      } catch (error) {
          return 0;
      }
  }

  function escuchadorAdjuntarAlbaranesInput(idInputRecibido) {

    console.log("numero " + numero)
    console.log("contenedorArchivos " + contenedorArchivos)
    
    var options = datalist.querySelectorAll('option');
    var found = false;

    options.forEach(function(option) {
        if (option.value === value) {
            found = true;
            return;
        }
    });

    if (found) {
        // Hacer algo si el valor está en el datalist
        console.log('El valor está en el datalist.');
         contenedorArchivos.hidden = true;
         segundoDiv.hidden = true;
    } else {

        contenedorArchivos.hidden = false;
        segundoDiv.hidden = false;

    /**Funcion adjuntar albaranes al expediente */
function adjuntarAlbaranesAlExpediente() {
  console.group("📎 adjuntarAlbaranesAlExpediente");

  var datalist = document.getElementById('datalistAlbaranesSinFactura');
  var options = datalist ? datalist.querySelectorAll('option') : [];
  var found = false;

  console.log("▶ options datalist:", options.length);

  var containerElement = document.getElementById('contenedorSecundario');
  if (!containerElement) {
    console.error("❌ No existe contenedorSecundario");
    console.groupEnd();
    return;
  }

  var chil = containerElement.children;
  var numerosIdElementos = [];

  console.group("🔢 Extrayendo IDs hijos");
  for (var i = 0; i < chil.length; i++) {
    var nombreHijo = chil[i].id;
    var match = nombreHijo.match(/\d+$/);

    if (!match) {
      console.warn("⚠️ ID sin número:", nombreHijo);
      continue;
    }

    var numero = parseInt(match[0]);
    numerosIdElementos.push(numero);
    console.log("✔ Hijo:", nombreHijo, "→", numero);
  }
  console.groupEnd();

  var arrayChildensConImagen = [];

  console.group("🧪 Evaluando cada bloque");
  for (var i = 0; i < numerosIdElementos.length; i++) {
    var id = numerosIdElementos[i];
    console.group("🔹 Iteración ID:", id);

    var nAlbaranInput = document.getElementById('nAlbaran' + id);
    var fechaInput = document.getElementById('fechaAlbaran' + id);
    var contendorImg = document.getElementById('listaImg' + id);

    var nAlbaranValue = nAlbaranInput ? nAlbaranInput.value : "";
    var nFechaValue = fechaInput ? fechaInput.value : "";

    console.log("nAlbaran:", nAlbaranValue);
    console.log("fechaAlbaran:", nFechaValue);
    console.log("contenedorImg existe:", !!contendorImg);

    if (nAlbaranValue !== "") {
      console.log("➡️ Tiene número de albarán, comprobando duplicados");

      options.forEach(function(option) {
        if (option.value === nAlbaranValue) {
          found = true;
          console.warn("⚠️ Albarán duplicado:", nAlbaranValue);

          if (fechaInput) fechaInput.value = "";
          var idArchivo = document.getElementById('idArchivoAlbaran' + id);
          if (idArchivo) idArchivo.value = "";
        }
      });

      if (contendorImg && nFechaValue !== "") {
        console.log("✅ Imagen + fecha → se añade a procesar");
        arrayChildensConImagen.push(id);
      } else {
        console.log("⛔ Falta imagen o fecha");
      }
    } else {
      console.log("⛔ No hay número de albarán");
    }

    console.groupEnd();
  }
  console.groupEnd();

  console.log("📦 arrayChildensConImagen:", arrayChildensConImagen);
  console.log("🔎 found duplicados:", found);

  if (!found && arrayChildensConImagen.length === 0) {
    console.warn("❌ Ningún elemento válido");
    generarAviso('¡Ningun elemento completo!', 'error', false, false, '');
    console.groupEnd();
    return;
  }

  mostrarOcultarLoaderGeneral(
    'cargaEnvioGeneral',
    'textoCargaGeneral',
    "Añadiendo archivos.",
    'ocultarImportant',
    'carga'
  );

  if (arrayChildensConImagen.length > 0) {
    archivosFacturasEnEspera = arrayChildensConImagen.length;
    console.log("⏳ Archivos en espera:", archivosFacturasEnEspera);

    arrayChildensConImagen.forEach(function(id) {
      console.group("⬆️ Subiendo archivo ID:", id);

      var contendorImg = document.getElementById('listaImg' + id);
      if (!contendorImg) {
        console.warn("⚠️ No hay imágenes para ID:", id);
        console.groupEnd();
        return;
      }

      subirArchivoAlbaranModificado(
        '.obj' + id,
        'idArchivoAlbaran' + id,
        arrayChildensConImagen
      );

      console.groupEnd();
    });

  } else {
    console.log("📭 No hay archivos, comprobando fotos");
    archivosFacturasEnEspera = 0;
    comprobarFotosAlbaranes();
  }

  console.groupEnd();
}

    function generarColumnas(datos,tabla) {
    return datos.map(([titulo, indice, tipo,idBtn,nombreClase,icono]) => {
      let configuracionColumna = {
        title: titulo,
        data: [indice],
        className: nombreClase, // Aplica la clase CSS 'titulo-columna'
      };
      if (tipo === 'date') {
        configuracionColumna.type = 'date';
        configuracionColumna.render = function (data, type, row) {
          return data ? moment(data).format('YY/MM/DD HH:mm:ss') : '';
        };
      } else if (tipo === 'date2') {
        configuracionColumna.type = 'date';
        configuracionColumna.render = function (data, type, row) {
          return data ? moment(data).format('DD/MM/YY') : '';
        };
      } else if (tipo === 'date3') {
        configuracionColumna.type = 'date';
        configuracionColumna.render = function (data, type, row) {
          return data ? moment(data).format('YYYY-MM-DD') : '';
        };
      } else if (tipo === 'date4') {
        configuracionColumna.type = 'date';
        configuracionColumna.render = function (data, type, row) {
          return data ? moment(data).format('YYYY-MM-DD HH:mm:ss') : '';
        };
      }else if (tipo === 'lengtharray') {
        configuracionColumna.render = function (data, type, row) {
          var numeroarray = obtenerLongitudArrayParaNumAlbaranes(data)
          return numeroarray;
        };
      }else if (tipo === 'lengtharray2') {

        configuracionColumna.render = function (data, type, row) {
            var numalbaranes=0;
            for (var e = 0; e < albaranes.length; e++) {
              if(albaranes[e][6] == data){
                numalbaranes++;
              }
            }     
          return numalbaranes;
        };
      }else if (tipo === 'enlaces') {
        configuracionColumna.render = function (data, type, row) {
          var enlaces = [data]
          var enlacesR = '';
          for (var i = 0; i < enlaces.length; i++) {
            enlacesR += '<a class="enviarCorreo" href="' + enlaces[i] + '" target="_blank"><i class="Small material-icons btnPdf">picture_as_pdf</i></a>';
          }
          return enlacesR;
        };
      }else if (tipo === 'copiarTexto') {
        configuracionColumna.render = function (data, type, row) {
   
            var text = '<a onclick="copiarTexto(\''+data+'\')" style="cursor: pointer; color: #434141;">' + data + '</a>';
          
          return text;
        };
      }else if (tipo === 'buscadorClick') {
        configuracionColumna.render = function (data, type, row) {
           var stringEnviar = data + " - " + tabla
   
            var text = '<a onclick="buscadorBotonTabla(\''+stringEnviar+'\')" style="cursor: pointer; color: #434141;">' + data + '</a>';
          
          return text;
        };
      }else if (tipo === 'boton') {
        configuracionColumna.render = function (data, type, row) {
          var html = '<a type="button" id="btnRevisarFactura" data-row="' + row[1] + '" class="seleccionar-fila tooltipped" data-tooltip="Revisar factura \'' + row[1] + '\'."><i class="material-icons">remove_red_eye</i></a>';
          html += '<a type="button" id="btnInfoProveedorS" data-row="' + row[1] + '" class="seleccionar-fila tooltipped" data-tooltip="Datos proveedor."><i class="material-icons">assignment_ind</i></a>'
          return html;
          // var html = '<a type="button" id="' + idBtn + '" data-row="' + row[1] + '" class="seleccionar-fila tooltipped" data-tooltip="Revisar factura \'' + row[1] + '\'."><i class="material-icons">' + icono + '</i></a>';
          // return html;
        };
      }else if (tipo === 'botonesPDFirmando') {
        configuracionColumna.render = function (data, type, row) {
        var enlaces = [data]
        var arrayEnlaces = enlaces.map(enlace => {
            // Intenta dividir el enlace por " - "
            var splittedEnlace = enlace.split(" - ");

            // Si se puede dividir y hay más de un enlace, devolver ambos enlaces, de lo contrario, solo el primer enlace
            return splittedEnlace.length > 1 ? splittedEnlace : [enlace];
        });

      }else if (tipo === 'estado') {

  function buscadorBotonTabla(stringEnviarRecibido) {
    var arrayTextoTabla = stringEnviarRecibido.split(" - ");
    var textoBoton = arrayTextoTabla[0];
    var tablaBoton = arrayTextoTabla[1];

    // Obtén la referencia al filtro utilizando el ID proporcionado:
    var filtro = document.getElementById(tablaBoton + "_filter").getElementsByTagName("input")[0];

    // Establece el valor de búsqueda en el filtro:
    filtro.value = textoBoton;

    // Dispara un evento "input" para que el DataTable actualice los resultados:
    var eventoInput = new Event("input", { bubbles: true });
    filtro.dispatchEvent(eventoInput);

    var miTablaColocar = document.getElementById(tablaBoton);
    if (miTablaColocar && $.fn.DataTable.isDataTable(miTablaColocar)) {
    // Accede al DataTable de la tabla y busca en la columna "Estado":
    var dataTableColocar = $(miTablaColocar).DataTable();
     dataTableColocar.columns.adjust().draw("page");
    }
}

<script>
  function generarTabla(idTabla, datos, encabezado, columnas, arraycolumnasFechas) {
    console.log("=== INICIO generarTabla ===");
    console.log("idTabla:", idTabla);
    console.log("datos:", datos);
    console.log("encabezado:", encabezado);

    // Define el formato de fecha para DataTables
    $.fn.dataTable.moment('YYYY-MM-DD');

    // Crea la tabla utilizando DataTables
    var tabla = $(idTabla).DataTable({
      responsive: true,
      autoWidth: true,
      headerCallback: function(thead, data, start, end, display) {
        //console.log("headerCallback ejecutado");
        $(thead).attr('id', 'miEncabezado'); // Agrega el id 'miEncabezado' al encabezado
      },
      fixedHeader: false,
      language: idiomaEspanol,
      dom: 'Blfrtip',
      data: datos,
      columns: columnas,
      buttons: [
        {
          extend: 'searchBuilder',
          config: {
            depthLimit: 2,
            datetime: {
              dateColumn: 'fechaProximoPreventivo',
              format: 'YYYY-MM-DD'
            }
          },
          attr: {
            id: idSin+'btnBusquedaAvanzada1',
            class:'btnTabla'
          }
        },
        {
          extend: 'copy',
          text: 'Copy',
          attr: { id: idSin+'btnCopy', class:'btnTabla' }
        },
        {
          extend: 'csv',
          text: 'CSV',
          attr: { id: idSin+'btnCSV', class:'btnTabla' }
        },
        {
          extend: 'excel',
          text: 'Excel',
          attr: { id: idSin+'btnExcel', class:'btnTabla' }
        },
        {
          extend: 'pdf',
          text: 'PDF',
          attr: { id: idSin+'btnPDF', class:'btnTabla' }
        },
        {
          extend: 'print',
          text: 'Print',
          attr: { id: idSin+'btnPrint', class:'btnTabla' }
        }
      ],
      columnDefs: [
        { className: 'dt-center', targets: '_all' },
        { type: 'date', targets: arraycolumnasFechas }
      ],
      initComplete: function () {
        console.log("initComplete ejecutado");

        $(idTabla + '_length, ' + idTabla + '_filter, ' + idTabla + 'btnBusquedaAvanzada1, ' + idTabla + 'btnPrint, ' + idTabla + 'btnPDF, ' + idTabla + 'btnExcel, ' + idTabla + 'btnCSV, ' + idTabla + 'btnCopy')
          .wrapAll('<div id="buscador" class="buscadorOcultar"></div>');
        console.log("Botones y filtros envueltos en div 'buscador'");
      },
    });

    console.log("Tabla creada con DataTables");

    // Escuchadores de eventos
    tabla.on('page.dt', function() {
      //console.log("ENTRA EN ESCUCHADOR page");
      var tablaExistente = tabla.table();
      if (tablaExistente) {
        tablaExistente.columns.adjust().draw("page");
        currentIndex = 0;
        console.log("Tabla ajustada en cambio de página");
      }
    });

    tabla.on('search.dt', function() {
      //console.log("ENTRA EN ESCUCHADOR search");
      var tablaExistente = tabla.table();
      var numResultados = tablaExistente.rows({ search: 'applied' }).count();
      //console.log("Número de resultados filtrados:", numResultados);
      if (numResultados > 0) {
        tablaExistente.columns.adjust().draw("page");
        currentIndex = 0;
        //console.log("Tabla ajustada después de búsqueda");
      }
    });

    tabla.on('length.dt', function() {
      //console.log("ENTRA EN ESCUCHADOR length");
      var tablaExistente = tabla.table();
      if (tablaExistente) {
        tablaExistente.columns.adjust().draw("page");
        console.log("Tabla ajustada por cambio de longitud de página");
      }
    });

    // Añadir el tooltip al encabezado específico
    $(idTabla + ' th.titulo-columna').filter(function() {
      return $(this).text().trim() === 'euros_SIN_IVA';
    }).on('mouseover', function() {
      var tooltipText = obtenerCantidadPrecioSumaDesdeTabla();
      console.log("Tooltip actualizado con:", tooltipText);
      $(this).attr('title', tooltipText);
    });

    var elemsTooltipped = document.querySelectorAll('.tooltipped');
    var instances = M.Tooltip.init(elemsTooltipped);
    console.log("Tooltips inicializados:", instances);

    console.log("=== FIN generarTabla ===");
  }

</script>

<script>
  function habilitarCamposDeEntrada(idFormulario) {
    // Obtener el formulario por su ID
    var formulario = document.getElementById(idFormulario);

    // Verificar si el formulario existe
    if (formulario) {
        // Obtener todos los elementos del formulario
        var elementos = formulario.elements;

        // Iterar sobre los elementos del formulario
        for (var i = 0; i < elementos.length; i++) {
            // Verificar si el elemento es un campo de entrada
            if (elementos[i].tagName === 'INPUT' || elementos[i].tagName === 'TEXTAREA') {
                // Habilitar el campo de entrada
                elementos[i].disabled = false;
            }
        }
    } else {
    }
} 
  function obtenerValoresFormulario(idFormulario) {
    var formulario = document.getElementById(idFormulario);
    var elementos = formulario.elements;
    var valores = {};

    for (var i = 0; i < elementos.length; i++) {
      var elemento = elementos[i];
      
      // Verificar si el elemento es un campo de entrada y tiene un nombre
      if (elemento.type !== 'button' && elemento.type !== 'submit' && elemento.name !== '') {
        // Obtener el valor del campo
        valores[elemento.name] = elemento.value;
      }
    }

    return valores;
  }

  function reiniciarCampos(valores){
    for(i=0;i<valores.length;i++){
      var validacion = document.getElementById("validacion"+valores[i].id)
      var avisoExistente = document.getElementById(valores[i].id+"Valid");
      if (avisoExistente) {
        validacion.removeChild(avisoExistente);
      }
      if(valores[i].value.length==0 ||valores[i].value==0 ){
        valores[i].className = "campoRellenable noValido materialize-textarea";
        validacion.classList.remove("clasevalidacion");
        const contenedorValid = document.createElement('div');
        contenedorValid.classList.remove("validacionRojo");
        contenedorValid.setAttribute("id",valores[i].id+"Valid")
        contenedorValid.innerHTML=""
        validacion.appendChild(contenedorValid)
      }else{
        valores[i].className = "campoRellenable noValido materialize-textarea";
        validacion.classList.remove("clasevalidacion");
        const contenedorValid = document.createElement('div');
        contenedorValid.classList.remove("validacionVerde");
        contenedorValid.setAttribute("id",valores[i].id+"Valid")
        contenedorValid.innerHTML=""
        validacion.appendChild(contenedorValid)
      }

            document.getElementById(valores[i].id).value= ""
      valores[i].value=" "
    }
  }

    function comprobarCampos(valores){
    for(i=0;i<valores.length;i++){
      var validacion = document.getElementById("validacion"+valores[i].id)
      var avisoExistente = document.getElementById(valores[i].id+"Valid");
      if (avisoExistente) {
        validacion.removeChild(avisoExistente);
      }
      if(valores[i].value.length==0 ||valores[i].value==0 ){
        valores[i].className = "campoRellenable noValido materialize-textarea";
        validacion.setAttribute("class","clasevalidacion")
        const contenedorValid = document.createElement('div');
        contenedorValid.setAttribute("class","validacionRojo")
        contenedorValid.setAttribute("id",valores[i].id+"Valid")
        contenedorValid.innerHTML="Revisar campo!"
        validacion.appendChild(contenedorValid)
      }else{
        valores[i].className = "campoRellenable valido materialize-textarea";
        validacion.setAttribute("class","clasevalidacion")
        const contenedorValid = document.createElement('div');
        contenedorValid.setAttribute("class","validacionVerde")
        contenedorValid.setAttribute("id",valores[i].id+"Valid")
        contenedorValid.innerHTML="Correcto!"
        validacion.appendChild(contenedorValid)
      }
    }
  }

  function limpiarCampos(valores) {
    for (i = 0; i < valores.length; i++) {
      valores[i].className = "campoRellenable materialize-textarea";
      var avisoExistente = document.getElementById(valores[i].id + "Valid");
      if (avisoExistente) {
        avisoExistente.parentNode.removeChild(avisoExistente);
      }
    }
  }

function addFrame(contenedor, array, titulo, longitud, idIframe, clase) {

  console.log("🔍 Ejecutando addFrame...");
  console.log("➡ contenedor:", contenedor);
  console.log("➡ array:", array);
  console.log("➡ titulo:", titulo);
  console.log("➡ longitud:", longitud);
  console.log("➡ idIframe:", idIframe);
  console.log("➡ clase:", clase);

  array.forEach(function (enlace, index) {

    console.log("--------------------------------------------------");
    console.log("📌 Procesando índice:", index);
    console.log("📌 Enlace recibido:", enlace);

    let fileId = null;

    try {
      if (!enlace) {
        console.warn("⚠ Enlace nulo o vacío en índice", index);
        return; // saltar este elemento
      }
      const match = enlace.match(/\/d\/(.+?)\//);
      console.log("🔎 Resultado regex:", match);

      if (!match) {
        console.error("❌ No se pudo extraer fileId del enlace:", enlace);
      } else {
        fileId = match[1];
      }

    } catch (e) {
      console.error("❌ Error extrayendo fileId:", e);
    }

    console.log("➡ fileId:", fileId);

    // Obtener nombre (por si se necesita)
    const fileName = enlace.substring(enlace.lastIndexOf('/') + 1);
    console.log("➡ fileName:", fileName);

    // Calcular número interno
    let numero;
    if (longitud === 1) {
      numero = null;
    } else {
      numero = index + 1;
    }
    console.log("➡ numero:", numero);

    // Crear iframe
    const iframe = document.createElement('iframe');
    console.log("🧱 iframe creado:", iframe);

    if (fileId) {
      iframe.src = "https://drive.google.com/file/d/" + fileId + "/preview";
    } else {
      console.warn("⚠ iframe sin src porque fileId es null");
    }

    iframe.width = "1500";
    iframe.height = "1200";

    iframe.id = idIframe;
    iframe.classList.add(clase);

    console.log("📤 Insertando iframe en contenedor...");
    contenedor.append(iframe);

  });

  console.log("✅ addFrame finalizado.");
}

function generarEnlacesGoogleDrive(fileIds, fileType) {
    // Convertir la cadena de IDs en un array
    var idsArray = fileIds.split(',');

    var enlaces = [];

    // Verificar el tipo de archivo y construir enlaces para cada ID
    if (fileType === 'doc') {
        enlaces = idsArray.map(function (id) {
            return 'https://docs.google.com/document/d/' + id.trim() + '/edit';
        });
    } else if (fileType === 'pdf') {
        enlaces = idsArray.map(function (id) {
            return 'https://drive.google.com/file/d/' + id.trim() + '/view?usp=drivesdk';
        });
    } else {
        // Tipo de archivo no reconocido
        return null;
    }

    return enlaces;
}

  /**Funcion para generar botones a traves de JS en el HTML
   * Recibe:
   * - id contenedor del destino donde se va a colocar el elemento
   * - id que se le va a dar al boton
   * - Clase CSS del boton
   * - string: funcion que va a ejecutar en el onclick
   * - texto del boton
   * - booleano habilitado o no
   * - booleano tooltip
   * - texto que va a aparecer en el tooltip si va a aparecer el texto
   * - Posicion de tooltip (top, button, left, right)
   * 
   * - Devuelve elemento html del boton
   */
function addBoton(contenedorBotones, idBtn, classBtn, funcion, txtoBtn, habilitado,tooltip,textooltip,posicion) {
    // Obtén el div donde quieres agregar el nuevo elemento
    var contenedorBotones = document.getElementById(contenedorBotones);
    // Crea un elemento de ancla <a>
    var boton = document.createElement('a');
    // Asigna los atributos al nuevo elemento
    boton.setAttribute('id', idBtn);
    boton.setAttribute('class', classBtn);
    boton.setAttribute('onclick', funcion); // Asigna la función pasada como parámetro
    if (habilitado) {
      boton.setAttribute('disabled', habilitado); // Asigna la función pasada como parámetro
    }
    boton.textContent = txtoBtn; // Establece el texto del enlace
    if (tooltip) {
      // Añadir tool tip de Materialize
      boton.setAttribute('data-tooltip', textooltip);
      boton.setAttribute('data-position', posicion);
      // Inicializar tooltip de Materialize
      M.Tooltip.init(boton);
    }
    // Agrega el nuevo elemento al div
    contenedorBotones.appendChild(boton);
    return boton;
}

  function addTituloNegrita(elementoHtml, idContenedor, texto, clase, id) {

    var partesTexto = texto.split("<b>");
    elemento.textContent = partesTexto[0]; // Establecer la primera parte del texto

    // Si hay una etiqueta <b> en el texto, agregar una parte de texto en negrita
    if (partesTexto.length > 1) {
        var spanNegrita = document.createElement("span");
        spanNegrita.innerHTML = partesTexto[1].split("</b>")[0];
        spanNegrita.style.fontWeight = "bold"; // Aplicar estilo de negrita al span
        elemento.appendChild(spanNegrita); // Anexar el span al elemento
        elemento.appendChild(document.createTextNode(partesTexto[1].split("</b>")[1])); // Anexar el resto del texto
    }

    if (id) {
        elemento.setAttribute("id", id);
    }
    // Anexar el elemento al contenedor padre
    contenedorPadre.appendChild(elemento);
}

    function updateSlideVisibility(iframes) {
      const counter = document.getElementById('counter');

      var totalSlides = iframes.length;
      if(currentIndex + 1>totalSlides){
        currentIndex=0;
      }

        iframes.forEach((iframe, index) => {
            if (index === currentIndex) {
                iframe.style.display = 'block';
            } else {
                iframe.style.display = 'none';
            }
        });
        counter.textContent = `${currentIndex + 1} / ${totalSlides}`;
    }

    function nextSlide() {

          const iframes = document.querySelectorAll('.iframe-slide');
            var totalSlides = iframes.length;

        currentIndex = (currentIndex + 1) % totalSlides;
        updateSlideVisibility(iframes);
    }

    // Función para retroceder al slide anterior
    function prevSlide() {
      const iframes = document.querySelectorAll('.iframe-slide');
      var totalSlides = iframes.length;

      currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
      updateSlideVisibility(iframes);
    }

  function copiarTexto(texto) {
    // Crea un elemento de textarea temporal
    var tempTextArea = document.createElement("textarea");
    // Asigna el texto al elemento de textarea
    tempTextArea.value = texto;
    // Oculta el textarea fuera del área visible de la pantalla
    tempTextArea.style.position = "absolute";
    tempTextArea.style.left = "-9999px";
    tempTextArea.style.top = "0";
    // Agrega el elemento temporal al DOM
    document.body.appendChild(tempTextArea);
    // Selecciona y copia el texto en el textarea temporal
    tempTextArea.select();
    document.execCommand("copy");
    // Elimina el elemento temporal del DOM
    document.body.removeChild(tempTextArea);
